name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main, "chore/core-*", "feat/a-*", "feat/b-*"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Impeccable UI check (PRs touching UI)
        if: github.event_name == 'pull_request'
        continue-on-error: true # Remove this line once M2B UI starts so it becomes a hard gate
        run: npx impeccable detect src/