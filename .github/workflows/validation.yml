name: Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "chore/core-*", "feat/a-*", "feat/b-*"]

permissions:
  contents: read

jobs:
  validation:
    name: Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@12.18.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: TypeScript
        run: pnpm exec next typegen && pnpm exec tsc --noEmit
      - name: Production build
        run: pnpm build
      # M0: add the mandatory test step when the real test harness is configured.
      # Introduce a pinned UI audit tool only when UI work requires it.
